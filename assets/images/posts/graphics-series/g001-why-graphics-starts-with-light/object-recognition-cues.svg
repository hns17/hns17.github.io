<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1450" viewBox="0 0 760 1450" role="img" aria-labelledby="title desc">
  <title id="title">윤곽, 색, 셰이딩과 그림자가 물체 인식을 돕는 과정</title>
  <desc id="desc">같은 원형 물체에 윤곽, 색, 셰이딩과 바닥 그림자가 차례로 더해지면서 표면의 형태와 공간 관계를 더 쉽게 해석하게 되는 모습을 세로 네 단계로 보여 준다.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <radialGradient id="shadedSphere" cx="34%" cy="25%" r="78%">
      <stop offset="0" stop-color="#fff7cc"/>
      <stop offset="0.22" stop-color="#fb7185"/>
      <stop offset="0.62" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#881337"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 36px "Segoe UI", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px "Segoe UI", "Noto Sans KR", sans-serif; fill: #475569; }
      .step { font: 700 29px "Segoe UI", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .body { font: 500 24px "Segoe UI", "Noto Sans KR", sans-serif; fill: #334155; }
      .small { font: 500 22px "Segoe UI", "Noto Sans KR", sans-serif; fill: #475569; }
      .note { font: 600 24px "Segoe UI", "Noto Sans KR", sans-serif; fill: #1e3a8a; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .ground { stroke: #94a3b8; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="760" height="1450" rx="30" fill="url(#background)"/>
  <text x="42" y="61" class="title">픽셀의 단서에서 물체를 읽는다</text>
  <text x="42" y="101" class="subtitle">단서가 더해질수록 형태와 공간 관계가 분명해진다.</text>

  <g transform="translate(40 145)" filter="url(#cardShadow)">
    <rect class="card" width="680" height="250" rx="22"/>
    <circle cx="54" cy="52" r="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="54" y="62" text-anchor="middle" class="step" font-size="23">1</text>
    <text x="101" y="63" class="step">윤곽</text>
    <circle cx="172" cy="153" r="72" fill="#64748b" stroke="#1e293b" stroke-width="7"/>
    <line x1="84" y1="230" x2="260" y2="230" class="ground"/>
    <text x="310" y="128" class="body">물체와 배경의 경계를 알려 준다.</text>
    <text x="310" y="170" class="small">하지만 납작한 원인지 둥근 구인지는</text>
    <text x="310" y="203" class="small">아직 분명하지 않다.</text>
  </g>

  <line x1="380" y1="400" x2="380" y2="428" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(40 435)" filter="url(#cardShadow)">
    <rect class="card" width="680" height="250" rx="22"/>
    <circle cx="54" cy="52" r="28" fill="#fee2e2" stroke="#e11d48" stroke-width="2"/>
    <text x="54" y="62" text-anchor="middle" class="step" font-size="23">2</text>
    <text x="101" y="63" class="step">색</text>
    <circle cx="172" cy="153" r="72" fill="#e11d48" stroke="#9f1239" stroke-width="7"/>
    <line x1="84" y1="230" x2="260" y2="230" class="ground"/>
    <text x="310" y="128" class="body">표면을 구분하는 단서가 된다.</text>
    <text x="310" y="170" class="small">같은 표면도 조명에 따라 눈에 보이는</text>
    <text x="310" y="203" class="small">색은 달라질 수 있다.</text>
  </g>

  <line x1="380" y1="690" x2="380" y2="718" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(40 725)" filter="url(#cardShadow)">
    <rect class="card" width="680" height="250" rx="22"/>
    <circle cx="54" cy="52" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="54" y="62" text-anchor="middle" class="step" font-size="23">3</text>
    <text x="101" y="63" class="step">셰이딩</text>
    <circle cx="172" cy="153" r="72" fill="url(#shadedSphere)" stroke="#9f1239" stroke-width="7"/>
    <line x1="84" y1="230" x2="260" y2="230" class="ground"/>
    <text x="310" y="128" class="body">밝기의 변화가 표면 방향을 드러낸다.</text>
    <text x="310" y="170" class="small">명암을 따라가면 물체가 어디에서</text>
    <text x="310" y="203" class="small">굽어 있는지 추론할 수 있다.</text>
  </g>

  <line x1="380" y1="980" x2="380" y2="1008" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(40 1015)" filter="url(#cardShadow)">
    <rect class="card" width="680" height="250" rx="22"/>
    <circle cx="54" cy="52" r="28" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="54" y="62" text-anchor="middle" class="step" font-size="23">4</text>
    <text x="101" y="63" class="step">그림자</text>
    <ellipse cx="188" cy="224" rx="78" ry="19" fill="#0f172a" opacity="0.23"/>
    <circle cx="160" cy="137" r="72" fill="url(#shadedSphere)" stroke="#9f1239" stroke-width="7"/>
    <line x1="84" y1="230" x2="270" y2="230" class="ground"/>
    <text x="310" y="128" class="body">물체와 주변 표면의 관계를 알려 준다.</text>
    <text x="310" y="170" class="small">접촉 여부와 상대적 거리, 빛이 온</text>
    <text x="310" y="203" class="small">방향을 판단하게 돕는다.</text>
  </g>

  <rect x="40" y="1320" width="680" height="88" rx="20" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="380" y="1356" text-anchor="middle" class="note">이 단서들을 자연스럽게 만들려면</text>
  <text x="380" y="1388" text-anchor="middle" class="note">렌더러는 빛과 표면의 관계를 계산해야 한다.</text>
</svg>
