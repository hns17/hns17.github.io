<svg xmlns="http://www.w3.org/2000/svg" width="640" height="920" viewBox="0 0 640 920" role="img" aria-labelledby="title desc">
  <title id="title">모바일용 파면과 광선 매개변수 도해</title>
  <desc id="desc">파면의 수직 방향에서 광선을 얻는 과정과 시작점 방향 매개변수로 광선을 정의하는 과정을 세로로 보여 준다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#60a5fa"/></marker>
    <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#fde68a"/></marker>
    <style>
      .panel{fill:#fff;fill-opacity:.055;stroke:#94a3b8;stroke-width:2}
      .head{font:700 27px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .sub{font:500 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .label{font:700 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .math{font:700 24px "Consolas","Noto Sans KR",monospace;fill:#fde68a}
    </style>
  </defs>
  <rect width="640" height="920" rx="28" fill="url(#bg)"/>
  <text x="320" y="46" text-anchor="middle" class="head">파동의 세부를 광선으로</text>
  <text x="320" y="76" text-anchor="middle" class="sub">진행 방향을 남겨 장면과의 관계를 계산한다</text>
  <g transform="translate(35 105)">
    <rect class="panel" width="570" height="345" rx="20"/>
    <text x="285" y="42" text-anchor="middle" class="head">파면과 진행 방향</text>
    <path d="M105 85C140 115 140 235 105 265" fill="none" stroke="#c084fc" stroke-width="6"/>
    <path d="M215 75C255 110 255 240 215 275" fill="none" stroke="#a78bfa" stroke-width="6"/>
    <path d="M330 65C375 105 375 245 330 285" fill="none" stroke="#818cf8" stroke-width="6"/>
    <line x1="110" y1="175" x2="505" y2="175" stroke="#fde68a" stroke-width="6" marker-end="url(#goldArrow)"/>
    <text x="80" y="315" class="label">파면</text>
    <text x="310" y="315" class="label">수직 방향 = 광선</text>
  </g>
  <g transform="translate(35 475)">
    <rect class="panel" width="570" height="405" rx="20"/>
    <text x="285" y="42" text-anchor="middle" class="head">시작점과 방향으로 정의</text>
    <circle cx="82" cy="210" r="9" fill="#f8fafc"/>
    <line x1="82" y1="210" x2="500" y2="87" stroke="#60a5fa" stroke-width="7" marker-end="url(#blueArrow)"/>
    <circle cx="318" cy="140" r="10" fill="#fde68a"/>
    <line x1="82" y1="210" x2="202" y2="175" stroke="#fde68a" stroke-width="5" marker-end="url(#goldArrow)"/>
    <text x="55" y="245" class="label">O</text><text x="160" y="160" class="label">D</text><text x="330" y="132" class="label">P(t)</text>
    <text x="285" y="315" text-anchor="middle" class="math">P(t) = O + tD</text>
    <text x="285" y="352" text-anchor="middle" class="sub">t ≥ 0 · D가 단위 벡터면 t는 거리</text>
  </g>
</svg>
