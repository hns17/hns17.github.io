<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" role="img" aria-labelledby="title desc">
  <title id="title">모바일용 광원 출발과 카메라 출발 경로 비교</title>
  <desc id="desc">광원에서 많은 경로를 따라가는 방법과 카메라 픽셀에서 표면과 광원으로 이어지는 필요한 경로를 찾는 방법을 세로로 비교한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <radialGradient id="sphere" cx="32%" cy="28%"><stop stop-color="#f8fafc"/><stop offset=".4" stop-color="#93c5fd"/><stop offset="1" stop-color="#1e3a8a"/></radialGradient>
    <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#fde68a"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#60a5fa"/></marker>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .panel{fill:#fff;fill-opacity:.055;stroke:#94a3b8;stroke-width:2}
      .head{font:700 27px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .sub{font:500 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .label{font:700 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
    </style>
  </defs>
  <rect width="640" height="1080" rx="28" fill="url(#bg)"/>
  <text x="320" y="46" text-anchor="middle" class="head">물리적 이동과 계산 순서</text>
  <text x="320" y="76" text-anchor="middle" class="sub">픽셀에서 시작해 필요한 경로를 먼저 묻는다</text>
  <g transform="translate(35 105)">
    <rect class="panel" width="570" height="425" rx="20"/>
    <text x="285" y="42" text-anchor="middle" class="head">광원에서 모두 따라가기</text>
    <circle cx="100" cy="170" r="25" fill="#fef3c7" filter="url(#glow)"/>
    <g stroke="#fde68a" stroke-width="3" marker-end="url(#goldArrow)">
      <line x1="125" y1="160" x2="515" y2="85"/><line x1="126" y1="170" x2="520" y2="165"/>
      <line x1="125" y1="180" x2="510" y2="255"/><line x1="117" y1="193" x2="400" y2="345"/>
      <line x1="97" y1="195" x2="60" y2="350"/>
    </g>
    <circle cx="330" cy="260" r="66" fill="url(#sphere)"/>
    <path d="M475 320l42 -20v70l-42 -20z" fill="#94a3b8"/><rect x="445" y="309" width="31" height="52" rx="5" fill="#cbd5e1"/>
    <line x1="115" y1="187" x2="460" y2="332" stroke="#86efac" stroke-width="6" marker-end="url(#goldArrow)"/>
    <text x="285" y="397" text-anchor="middle" class="label">대부분은 선택 픽셀과 무관</text>
  </g>
  <g transform="translate(35 555)">
    <rect class="panel" width="570" height="485" rx="20"/>
    <text x="285" y="42" text-anchor="middle" class="head">카메라에서 필요한 길 찾기</text>
    <circle cx="105" cy="118" r="25" fill="#fef3c7" filter="url(#glow)"/>
    <circle cx="355" cy="250" r="82" fill="url(#sphere)"/>
    <path d="M92 388L50 368v70l42-20z" fill="#94a3b8"/><rect x="92" y="377" width="31" height="52" rx="5" fill="#cbd5e1"/>
    <rect x="128" y="389" width="9" height="28" fill="#60a5fa"/>
    <line x1="137" y1="403" x2="288" y2="292" stroke="#60a5fa" stroke-width="7" marker-end="url(#blueArrow)"/>
    <line x1="288" y1="292" x2="119" y2="136" stroke="#fde68a" stroke-width="6" stroke-dasharray="10 8" marker-end="url(#goldArrow)"/>
    <circle cx="288" cy="292" r="8" fill="#f8fafc"/>
    <text x="205" y="365" class="sub">Viewing Ray</text><text x="130" y="245" class="sub">Shadow Ray</text>
    <text x="285" y="458" text-anchor="middle" class="label">픽셀 → 표면 → 광원 질문</text>
  </g>
</svg>
