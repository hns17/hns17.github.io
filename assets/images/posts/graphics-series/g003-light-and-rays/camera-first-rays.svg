<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">광원에서 가능한 경로를 발사하는 방식과 카메라에서 필요한 경로를 찾는 방식</title>
  <desc id="desc">왼쪽은 광원에서 많은 방향으로 뻗지만 카메라에 닿는 경로가 적고, 오른쪽은 카메라 픽셀에서 표면과 광원을 연결하는 경로를 찾는다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <radialGradient id="sphere" cx="32%" cy="28%"><stop stop-color="#f8fafc"/><stop offset=".4" stop-color="#93c5fd"/><stop offset="1" stop-color="#1e3a8a"/></radialGradient>
    <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#fde68a"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#60a5fa"/></marker>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .panel{fill:#fff;fill-opacity:.055;stroke:#94a3b8;stroke-width:2}
      .head{font:700 29px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .sub{font:500 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .label{font:700 19px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .small{font:500 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
    </style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" class="head">물리적 이동과 계산 순서는 다를 수 있다</text>
  <text x="600" y="84" text-anchor="middle" class="sub">최종 픽셀에서 시작하면 필요한 경로 후보를 먼저 찾을 수 있다</text>

  <g transform="translate(45 120)">
    <rect class="panel" width="530" height="525" rx="22"/>
    <text x="265" y="44" text-anchor="middle" class="head">광원에서 모두 따라가기</text>
    <circle cx="105" cy="210" r="28" fill="#fef3c7" filter="url(#glow)"/>
    <g stroke="#fde68a" stroke-width="3" marker-end="url(#goldArrow)">
      <line x1="132" y1="198" x2="475" y2="90"/>
      <line x1="133" y1="207" x2="480" y2="180"/>
      <line x1="132" y1="218" x2="470" y2="285"/>
      <line x1="126" y1="230" x2="400" y2="395"/>
      <line x1="110" y1="238" x2="190" y2="455"/>
      <line x1="93" y1="238" x2="55" y2="455"/>
    </g>
    <circle cx="345" cy="310" r="72" fill="url(#sphere)"/>
    <path d="M438 430 l44 -22 v78 l-44 -22z" fill="#94a3b8"/>
    <rect x="408" y="418" width="34" height="58" rx="5" fill="#cbd5e1"/>
    <line x1="110" y1="223" x2="424" y2="440" stroke="#86efac" stroke-width="6" marker-end="url(#goldArrow)"/>
    <text x="265" y="500" text-anchor="middle" class="label">대부분은 선택한 픽셀과 무관</text>
  </g>

  <g transform="translate(625 120)">
    <rect class="panel" width="530" height="525" rx="22"/>
    <text x="265" y="44" text-anchor="middle" class="head">카메라에서 필요한 길 찾기</text>
    <circle cx="105" cy="135" r="28" fill="#fef3c7" filter="url(#glow)"/>
    <circle cx="325" cy="280" r="86" fill="url(#sphere)"/>
    <path d="M92 430 l-44 -22 v78 l44 -22z" fill="#94a3b8"/>
    <rect x="92" y="418" width="34" height="58" rx="5" fill="#cbd5e1"/>
    <rect x="133" y="431" width="10" height="32" fill="#60a5fa"/>
    <line x1="143" y1="447" x2="262" y2="319" stroke="#60a5fa" stroke-width="7" marker-end="url(#blueArrow)"/>
    <line x1="262" y1="319" x2="112" y2="151" stroke="#fde68a" stroke-width="6" stroke-dasharray="10 8" marker-end="url(#goldArrow)"/>
    <circle cx="262" cy="319" r="9" fill="#f8fafc"/>
    <text x="165" y="405" class="small">Viewing Ray</text>
    <text x="120" y="260" class="small">Shadow Ray</text>
    <text x="265" y="500" text-anchor="middle" class="label">픽셀 → 표면 → 광원 질문</text>
  </g>
</svg>
