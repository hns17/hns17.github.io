<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img" aria-labelledby="title desc">
  <title id="title">Ray Tracing의 광선 추적과 Rasterization의 모델 투영 비교</title>
  <desc id="desc">Ray Tracing은 카메라에서 Pixel Sample 방향으로 광선을 만들어 표면을 추적하고, Rasterization은 삼각형을 투영해 화면 Sample과 Fragment 후보를 찾는다. 두 방식 모두 이후 조명 계산에 빛 방향 벡터를 사용할 수 있다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="#111c38"/>
      <path d="M34 0H0V34" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="17" cy="17" r="2.5" fill="#94a3b8"/>
    </pattern>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#60a5fa"/></marker>
    <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#fde68a"/></marker>
    <style>
      .panel{fill:#fff;fill-opacity:.055;stroke:#94a3b8;stroke-width:2}
      .head{font:700 27px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .sub{font:500 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .small{font:500 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .step{font:700 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#0f172a}
    </style>
  </defs>

  <rect width="640" height="1160" rx="28" fill="url(#bg)"/>
  <text x="320" y="46" text-anchor="middle" class="head">보이는 표면을 찾는 두 계산 순서</text>
  <text x="320" y="76" text-anchor="middle" class="sub">광선 추적 / 모델 투영</text>

  <g transform="translate(35 105)">
    <rect class="panel" width="570" height="445" rx="20"/>
    <text x="285" y="40" text-anchor="middle" class="head">Ray Tracing</text>
    <text x="285" y="68" text-anchor="middle" class="sub">카메라가 이 Sample 방향에서 무엇을 보는가?</text>

    <path d="M62 183L30 166V222L62 205Z" fill="#94a3b8"/><rect x="62" y="174" width="28" height="40" rx="4" fill="#cbd5e1"/>
    <rect x="112" y="112" width="102" height="136" fill="url(#grid)" stroke="#94a3b8" stroke-width="2"/>
    <rect x="146" y="180" width="34" height="34" fill="#2563eb" stroke="#bfdbfe" stroke-width="3"/>
    <polygon points="376,95 526,205 356,286" fill="#f97316" fill-opacity=".45" stroke="#fdba74" stroke-width="5"/>
    <line x1="90" y1="194" x2="402" y2="181" stroke="#60a5fa" stroke-width="7" marker-end="url(#blueArrow)"/>
    <circle cx="402" cy="181" r="9" fill="#f8fafc" stroke="#60a5fa" stroke-width="3"/>

    <circle cx="76" cy="323" r="15" fill="#93c5fd"/><text x="76" y="329" text-anchor="middle" class="step">1</text>
    <text x="100" y="329" class="small">Sample을 지나는 Camera Ray 생성</text>
    <circle cx="76" cy="359" r="15" fill="#93c5fd"/><text x="76" y="365" text-anchor="middle" class="step">2</text>
    <text x="100" y="365" class="small">광선과 삼각형 교차 추적</text>
    <circle cx="76" cy="395" r="15" fill="#93c5fd"/><text x="76" y="401" text-anchor="middle" class="step">3</text>
    <text x="100" y="401" class="small">가장 가까운 Hit 선택</text>
    <text x="285" y="430" text-anchor="middle" class="sub">가시성: 광선 교차 추적</text>
  </g>

  <g transform="translate(35 575)">
    <rect class="panel" width="570" height="490" rx="20"/>
    <text x="285" y="40" text-anchor="middle" class="head">Rasterization</text>
    <text x="285" y="68" text-anchor="middle" class="sub">이 삼각형은 어떤 Sample을 덮는가?</text>

    <polygon points="42,143 164,98 139,250" fill="#f97316" fill-opacity=".45" stroke="#fdba74" stroke-width="5"/>
    <line x1="178" y1="174" x2="246" y2="174" stroke="#fde68a" stroke-width="6" marker-end="url(#goldArrow)"/>
    <rect x="267" y="92" width="204" height="204" fill="url(#grid)" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="291,119 444,105 421,276" fill="#f97316" fill-opacity=".28" stroke="#fdba74" stroke-width="4"/>
    <g fill="#86efac" stroke="#14532d" stroke-width="2">
      <circle cx="318" cy="143" r="7"/><circle cx="352" cy="143" r="7"/><circle cx="386" cy="143" r="7"/><circle cx="420" cy="143" r="7"/>
      <circle cx="318" cy="177" r="7"/><circle cx="352" cy="177" r="7"/><circle cx="386" cy="177" r="7"/><circle cx="420" cy="177" r="7"/>
      <circle cx="352" cy="211" r="7"/><circle cx="386" cy="211" r="7"/><circle cx="420" cy="211" r="7"/>
      <circle cx="386" cy="245" r="7"/><circle cx="420" cy="245" r="7"/>
    </g>

    <circle cx="76" cy="337" r="15" fill="#fde68a"/><text x="76" y="343" text-anchor="middle" class="step">1</text>
    <text x="100" y="343" class="small">정점을 화면에 투영</text>
    <circle cx="76" cy="373" r="15" fill="#fde68a"/><text x="76" y="379" text-anchor="middle" class="step">2</text>
    <text x="100" y="379" class="small">삼각형 안의 Sample 탐색</text>
    <circle cx="76" cy="409" r="15" fill="#fde68a"/><text x="76" y="415" text-anchor="middle" class="step">3</text>
    <text x="100" y="415" class="small">Fragment 후보 → Depth Test</text>
    <rect x="337" y="389" width="192" height="32" rx="16" fill="#14532d"/>
    <text x="433" y="411" text-anchor="middle" class="small">Fragment ≠ 최종 Pixel</text>
    <text x="285" y="456" text-anchor="middle" class="sub">가시성: 투영과 Sample Coverage</text>
  </g>
  <text x="320" y="1110" text-anchor="middle" class="sub">두 방식 모두 셰이딩에서는</text>
  <text x="320" y="1136" text-anchor="middle" class="sub">N · L 같은 빛 방향 관계를 사용할 수 있다</text>
</svg>
