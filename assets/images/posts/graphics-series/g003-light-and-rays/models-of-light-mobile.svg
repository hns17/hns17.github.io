<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" role="img" aria-labelledby="title desc">
  <title id="title">모바일용 빛의 세 모델 비교</title>
  <desc id="desc">전자기파, 광자와 광선을 세로로 배치해 각각 간섭, 에너지 교환, 경로 계산을 설명한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60a5fa"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#fde68a"/></marker>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .panel{fill:#fff;fill-opacity:.055;stroke:#94a3b8;stroke-width:2}
      .head{font:700 28px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .sub{font:500 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .label{font:700 19px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .chip{font:700 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#0f172a}
    </style>
  </defs>
  <rect width="640" height="1080" rx="28" fill="url(#bg)"/>
  <text x="320" y="48" text-anchor="middle" class="head">하나의 빛, 세 가지 질문</text>
  <text x="320" y="78" text-anchor="middle" class="sub">현상과 계산 규모에 따라 모델을 고른다</text>

  <g transform="translate(35 110)">
    <rect class="panel" width="570" height="280" rx="20"/>
    <rect x="22" y="20" width="72" height="29" rx="15" fill="#93c5fd"/><text x="58" y="40" text-anchor="middle" class="chip">파동</text>
    <text x="125" y="44" class="head">전자기파</text>
    <path d="M36 138 C68 76 100 200 132 138 S196 76 228 138 S292 200 324 138" fill="none" stroke="url(#wave)" stroke-width="7"/>
    <path d="M380 118 C398 88 416 148 434 118 S470 88 488 118 S524 148 542 118" fill="none" stroke="#67e8f9" stroke-width="4"/>
    <path d="M380 118 C398 148 416 88 434 118 S470 148 488 118 S524 88 542 118" fill="none" stroke="#f9a8d4" stroke-width="4"/>
    <text x="285" y="214" text-anchor="middle" class="label">간섭 · 회절 · 편광</text>
    <text x="285" y="247" text-anchor="middle" class="sub">장과 위상의 변화가 필요한 질문</text>
  </g>

  <g transform="translate(35 410)">
    <rect class="panel" width="570" height="280" rx="20"/>
    <rect x="22" y="20" width="72" height="29" rx="15" fill="#fde68a"/><text x="58" y="40" text-anchor="middle" class="chip">양자</text>
    <text x="125" y="44" class="head">광자</text>
    <g fill="#fde68a" filter="url(#glow)"><circle cx="92" cy="134" r="15"/><circle cx="154" cy="108" r="10"/><circle cx="204" cy="152" r="18"/><circle cx="260" cy="116" r="12"/></g>
    <path d="M340 180H530" stroke="#64748b" stroke-width="5"/>
    <path d="M370 180v-36M420 180v-62M470 180v-30M515 180v-78" stroke="#fbbf24" stroke-width="7"/>
    <text x="285" y="214" text-anchor="middle" class="label">흡수 · 방출 · 검출</text>
    <text x="285" y="247" text-anchor="middle" class="sub">불연속 에너지 교환의 질문</text>
  </g>

  <g transform="translate(35 710)">
    <rect class="panel" width="570" height="330" rx="20"/>
    <rect x="22" y="20" width="72" height="29" rx="15" fill="#86efac"/><text x="58" y="40" text-anchor="middle" class="chip">기하</text>
    <text x="125" y="44" class="head">광선</text>
    <circle cx="85" cy="160" r="8" fill="#f8fafc"/>
    <line x1="85" y1="160" x2="490" y2="100" stroke="#fde68a" stroke-width="6" marker-end="url(#arrow)"/>
    <line x1="85" y1="160" x2="490" y2="160" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="85" y1="160" x2="490" y2="220" stroke="#f472b6" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="390" y="77" width="46" height="166" rx="7" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <text x="285" y="270" text-anchor="middle" class="label">교차 · 가시성 · 경로</text>
    <text x="285" y="303" text-anchor="middle" class="sub">장면 규모에서 진행 방향을 묻는다</text>
  </g>
</svg>
