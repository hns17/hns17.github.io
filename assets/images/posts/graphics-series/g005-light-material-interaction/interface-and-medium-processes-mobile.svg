<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1050" role="img" aria-labelledby="title desc">
  <title id="title">빛과 물질의 경계 및 내부 과정</title>
  <desc id="desc">입사광이 경계에서 반사와 굴절로 나뉜 뒤 물질 내부에서 흡수와 산란을 겪는 세로형 개념도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#122b45"/></linearGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17435a"/><stop offset="1" stop-color="#1b394d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="yl" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#fff2a8"/></marker>
    <marker id="cy" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#72ddff"/></marker>
    <style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#edf8ff}.label{font-size:26px;font-weight:700}.body{font-size:21px;fill:#bed4e4}.small{font-size:18px;fill:#aac2d5}</style>
  </defs>
  <rect width="640" height="1050" rx="24" fill="url(#bg)"/>
  <text x="320" y="55" font-size="28" font-weight="800" text-anchor="middle">경계와 내부, 두 단계로 읽기</text>
  <rect x="40" y="88" width="560" height="48" rx="24" fill="#243955" stroke="#7896ae"/>
  <text x="320" y="120" class="body" text-anchor="middle">1  물질의 경계에서 경로가 갈린다</text>

  <path d="M100 210 L320 390" fill="none" stroke="#fff2a8" stroke-width="9" marker-end="url(#yl)" filter="url(#glow)"/>
  <text x="85" y="190" class="label">입사광</text>
  <line x1="70" y1="410" x2="570" y2="410" stroke="#b3edf3" stroke-width="5"/>
  <line x1="320" y1="350" x2="320" y2="480" stroke="#7795ac" stroke-width="2" stroke-dasharray="7 8"/>
  <text x="340" y="365" class="small">법선</text>
  <path d="M320 410 L520 240" fill="none" stroke="#fff2a8" stroke-width="7" marker-end="url(#yl)"/>
  <text x="442" y="205" class="label">반사</text>

  <rect x="30" y="415" width="580" height="565" rx="20" fill="url(#mat)" stroke="#5c9caf" stroke-width="2"/>
  <path d="M320 410 C348 520 390 600 420 660" fill="none" stroke="#72ddff" stroke-width="9" marker-end="url(#cy)" filter="url(#glow)"/>
  <text x="74" y="500" class="label">투과 · 굴절</text>
  <text x="74" y="531" class="small">경계를 넘어 방향이 바뀐다</text>

  <rect x="40" y="558" width="560" height="48" rx="24" fill="#173f52" stroke="#4e9caf"/>
  <text x="320" y="590" class="body" text-anchor="middle">2  내부 이동에서 양과 방향이 변한다</text>
  <circle cx="430" cy="680" r="13" fill="#f3fbff" stroke="#72ddff" stroke-width="5"/>
  <path d="M439 672 L548 610" fill="none" stroke="#72ddff" stroke-width="5" marker-end="url(#cy)"/>
  <path d="M444 683 L567 706" fill="none" stroke="#72ddff" stroke-width="5" marker-end="url(#cy)"/>
  <path d="M436 692 L510 800" fill="none" stroke="#72ddff" stroke-width="5" marker-end="url(#cy)"/>
  <text x="115" y="685" class="label">산란</text>
  <text x="115" y="716" class="small">다른 방향에 남는다</text>

  <path d="M420 682 L315 805" fill="none" stroke="#ffb26f" stroke-width="5" stroke-dasharray="9 8"/>
  <circle cx="298" cy="825" r="23" fill="#4d2a31" stroke="#ff9d65" stroke-width="3"/>
  <path d="M287 814 l22 22 M309 814 l-22 22" stroke="#ffd0aa" stroke-width="4"/>
  <text x="298" y="875" class="label" text-anchor="middle">흡수</text>
  <text x="298" y="906" class="small" text-anchor="middle">빛이 아닌 에너지로 전환</text>

  <rect x="45" y="995" width="550" height="38" rx="16" fill="#0b1d31"/>
  <text x="320" y="1021" font-size="18" font-weight="700" text-anchor="middle">경로를 나눈 뒤, 내부 이동에서 다시 변화한다</text>
</svg>
