<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1340" role="img" aria-labelledby="title desc">
  <title id="title">흡수와 두 종류의 산란 사건</title>
  <desc id="desc">흡수, 바깥 산란, 안쪽 산란의 차이를 위아래로 비교한 모바일 그림</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#152f48"/></linearGradient>
    <linearGradient id="vol" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1a3d52"/><stop offset="1" stop-color="#234d5a" stop-opacity=".62"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="cy" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#76ddff"/></marker>
    <marker id="or" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#ffb16f"/></marker>
    <style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#edf8ff}.head{font-size:24px;font-weight:800}.label{font-size:19px;font-weight:700}.small{font-size:16px;fill:#b5cada}.eq{font-family:Consolas,monospace;font-size:18px;fill:#dcefff}</style>
  </defs>
  <rect width="640" height="1340" rx="24" fill="url(#bg)"/>
  <text x="320" y="50" font-size="27" font-weight="800" text-anchor="middle">빛이 줄거나 더해지는 세 사건</text>
  <text x="320" y="78" class="small" text-anchor="middle">점선은 카메라가 바라보는 기준 방향</text>

  <g>
    <rect x="35" y="105" width="570" height="330" rx="22" fill="url(#vol)" stroke="#47788e" stroke-width="2"/>
    <text x="320" y="145" class="head" text-anchor="middle">흡수 Absorption</text>
    <text x="320" y="172" class="small" text-anchor="middle">빛 에너지가 다른 형태로 전환된다</text>
    <line x1="75" y1="255" x2="565" y2="255" stroke="#7894a8" stroke-width="2" stroke-dasharray="7 9"/>
    <path d="M75 255 L285 255" stroke="#76ddff" stroke-width="10" marker-end="url(#cy)" filter="url(#glow)"/>
    <circle cx="310" cy="255" r="26" fill="#542d32" stroke="#ff9e66" stroke-width="3"/>
    <path d="M298 243 l24 24 M322 243 l-24 24" stroke="#ffd0a7" stroke-width="5"/>
    <text x="320" y="330" class="label" text-anchor="middle">현재 경로에서 제거 · 계수 σₐ</text>
    <text x="320" y="359" class="small" text-anchor="middle">다른 빛의 방향으로 남지 않는다</text>
  </g>

  <g>
    <rect x="35" y="460" width="570" height="330" rx="22" fill="url(#vol)" stroke="#47788e" stroke-width="2"/>
    <text x="320" y="500" class="head" text-anchor="middle">Out-scattering</text>
    <text x="320" y="527" class="small" text-anchor="middle">현재 방향의 빛을 다른 방향으로 보낸다</text>
    <line x1="75" y1="625" x2="565" y2="625" stroke="#7894a8" stroke-width="2" stroke-dasharray="7 9"/>
    <path d="M75 625 L295 625" stroke="#76ddff" stroke-width="10" marker-end="url(#cy)" filter="url(#glow)"/>
    <circle cx="320" cy="625" r="13" fill="#effbff" stroke="#76ddff" stroke-width="4"/>
    <path d="M330 616 L485 535" stroke="#76ddff" stroke-width="8" marker-end="url(#cy)" filter="url(#glow)"/>
    <text x="320" y="700" class="label" text-anchor="middle">현재 경로는 어두워짐 · 계수 σₛ</text>
    <text x="320" y="729" class="small" text-anchor="middle">빛은 다른 방향에 남아 있다</text>
  </g>

  <g>
    <rect x="35" y="815" width="570" height="330" rx="22" fill="url(#vol)" stroke="#47788e" stroke-width="2"/>
    <text x="320" y="855" class="head" text-anchor="middle">In-scattering</text>
    <text x="320" y="882" class="small" text-anchor="middle">다른 방향의 빛을 현재 방향에 더한다</text>
    <line x1="75" y1="980" x2="565" y2="980" stroke="#7894a8" stroke-width="2" stroke-dasharray="7 9"/>
    <path d="M160 890 L306 968" stroke="#ffb16f" stroke-width="9" marker-end="url(#or)" filter="url(#glow)"/>
    <circle cx="320" cy="980" r="13" fill="#fff6e9" stroke="#ffb16f" stroke-width="4"/>
    <path d="M333 980 L555 980" stroke="#ffb16f" stroke-width="11" marker-end="url(#or)" filter="url(#glow)"/>
    <text x="320" y="1055" class="label" text-anchor="middle">현재 경로가 밝아진다</text>
    <text x="320" y="1084" class="small" text-anchor="middle">새 방향은 Phase Function으로 분배</text>
  </g>

  <rect x="40" y="1180" width="560" height="124" rx="18" fill="#0a1d31" stroke="#355f7b"/>
  <text x="320" y="1216" class="eq" text-anchor="middle">σₜ(λ) = σₐ(λ) + σₛ(λ)</text>
  <text x="320" y="1248" class="eq" text-anchor="middle">Tᵣ(d, λ) = exp(−σₜ(λ)d)</text>
  <text x="320" y="1280" class="small" text-anchor="middle">산란광까지 사라졌다는 뜻은 아니다</text>
</svg>
