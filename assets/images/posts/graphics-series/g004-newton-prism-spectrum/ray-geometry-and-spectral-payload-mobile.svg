<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img" aria-labelledby="title desc">
  <title id="title">기하 광선과 스펙트럼 운반 정보의 비교 모바일 도해</title>
  <desc id="desc">시작점과 방향만 있는 광선과 스펙트럼 정보까지 가진 광선을 세로 패널로 비교한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7c3aed"/>
      <stop offset=".18" stop-color="#2563eb"/>
      <stop offset=".38" stop-color="#22c55e"/>
      <stop offset=".62" stop-color="#facc15"/>
      <stop offset=".82" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <style>
      .head{font:700 27px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .sub{font:500 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .label{font:700 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .small{font:500 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .panel{fill:#fff;fill-opacity:.05;stroke:#64748b;stroke-width:2}
      .note{fill:#172554;stroke:#60a5fa;stroke-width:2}
    </style>
  </defs>

  <rect width="640" height="1160" rx="26" fill="url(#bg)"/>
  <text x="320" y="48" text-anchor="middle" class="head">광선 방향만으로 색을 알 수 있을까?</text>
  <text x="320" y="79" text-anchor="middle" class="sub">경로와 빛의 구성은 서로 다른 정보다</text>

  <g transform="translate(30 108)">
    <rect width="580" height="438" rx="22" class="panel"/>
    <rect x="22" y="20" width="230" height="38" rx="19" fill="#334155"/>
    <text x="137" y="45" text-anchor="middle" class="label">1 · 기하 광선만 기록</text>
    <text x="290" y="96" text-anchor="middle" class="label">P(t) = O + tD</text>
    <circle cx="82" cy="150" r="12" fill="#f8fafc"/>
    <path d="M98 150H500" stroke="#f8fafc" stroke-width="7"/>
    <path d="M500 150L480 139V161Z" fill="#f8fafc"/>
    <text x="82" y="181" text-anchor="middle" class="small">O</text>
    <text x="290" y="135" text-anchor="middle" class="small">방향 D</text>
    <text x="290" y="218" text-anchor="middle" class="label">위치는 알지만 빛의 구성은 모른다</text>

    <g transform="translate(55 253)">
      <path d="M0 18H100" stroke="#f8fafc" stroke-width="5"/>
      <rect x="118" y="5" width="260" height="26" rx="13" fill="url(#spectrum)"/>
      <text x="396" y="23" class="small">흰빛</text>
    </g>
    <g transform="translate(55 305)">
      <path d="M0 18H100" stroke="#f8fafc" stroke-width="5"/>
      <rect x="118" y="5" width="260" height="26" rx="13" fill="#f59e0b"/>
      <text x="396" y="23" class="small">따뜻한 빛</text>
    </g>
    <g transform="translate(55 357)">
      <path d="M0 18H100" stroke="#f8fafc" stroke-width="5"/>
      <rect x="118" y="5" width="260" height="26" rx="13" fill="#3b82f6"/>
      <text x="396" y="23" class="small">푸른 빛</text>
    </g>
  </g>

  <g transform="translate(30 574)">
    <rect width="580" height="448" rx="22" class="panel"/>
    <rect x="22" y="20" width="286" height="38" rx="19" fill="#1e3a8a"/>
    <text x="165" y="45" text-anchor="middle" class="label">2 · 빛의 운반 정보도 기록</text>
    <rect x="55" y="80" width="470" height="76" rx="16" class="note"/>
    <text x="290" y="108" text-anchor="middle" class="label">경로 {O, D} + 스펙트럼 S(λ)</text>
    <rect x="105" y="127" width="370" height="16" rx="8" fill="url(#spectrum)"/>

    <circle cx="72" cy="233" r="10" fill="#f8fafc"/>
    <g transform="translate(84 226)">
      <path d="M0 0H226" stroke="#ef4444" stroke-width="3"/>
      <path d="M0 7H226" stroke="#22c55e" stroke-width="3"/>
      <path d="M0 14H226" stroke="#8b5cf6" stroke-width="3"/>
    </g>
    <polygon points="322,181 420,233 322,285" fill="#bfdbfe" fill-opacity=".2" stroke="#93c5fd" stroke-width="4"/>
    <path d="M372 233L515 201" stroke="#ef4444" stroke-width="6"/>
    <path d="M372 233L515 244" stroke="#22c55e" stroke-width="6"/>
    <path d="M372 233L515 298" stroke="#8b5cf6" stroke-width="6"/>
    <text x="290" y="330" text-anchor="middle" class="small">분산 전: 한 경로 · 분산 후: 파장별 D(λ)</text>

    <rect x="55" y="353" width="470" height="66" rx="16" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <text x="290" y="379" text-anchor="middle" class="label">S(λ): 어떤 빛이 얼마나 있는가</text>
    <text x="290" y="405" text-anchor="middle" class="label">D(λ): 그 파장이 어디로 가는가</text>
  </g>

  <rect x="70" y="1061" width="500" height="62" rx="25" fill="#1e3a8a"/>
  <text x="320" y="1087" text-anchor="middle" class="label">경로와 운반 정보는</text>
  <text x="320" y="1113" text-anchor="middle" class="label">서로 다른 질문에 답한다</text>
</svg>
