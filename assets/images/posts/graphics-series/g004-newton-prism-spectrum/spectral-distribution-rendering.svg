<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">연속 스펙트럼의 표본화와 렌더링 흐름</title>
  <desc id="desc">가시광 영역의 연속 함수 S 람다를 여러 파장에서 표본화하고 광원, 재질, 파장별 경로를 계산한 뒤 화면 RGB로 변환하는 과정을 나타낸다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7c3aed"/>
      <stop offset=".18" stop-color="#2563eb"/>
      <stop offset=".36" stop-color="#06b6d4"/>
      <stop offset=".51" stop-color="#22c55e"/>
      <stop offset=".68" stop-color="#facc15"/>
      <stop offset=".83" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0 0L0 6L9 3Z" fill="#94a3b8"/>
    </marker>
    <style>
      .head{font:700 30px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .sub{font:500 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .label{font:700 19px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .small{font:500 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .panel{fill:#fff;fill-opacity:.05;stroke:#64748b;stroke-width:2}
      .box{fill:#172554;stroke:#60a5fa;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="740" rx="28" fill="url(#bg)"/>
  <text x="600" y="53" text-anchor="middle" class="head">스펙트럼은 일곱 칸이 아니라 파장에 따른 함수다</text>
  <text x="600" y="85" text-anchor="middle" class="sub">컴퓨터는 연속적인 빛에서 유한한 파장을 Sample하고, 이동을 계산한 뒤 표시용 색으로 바꾼다</text>

  <g transform="translate(45 122)">
    <rect width="570" height="520" rx="22" class="panel"/>
    <text x="285" y="42" text-anchor="middle" class="label">연속 분포 S(λ)와 파장 Sample</text>
    <line x1="68" y1="347" x2="516" y2="347" stroke="#94a3b8" stroke-width="2"/>
    <line x1="68" y1="347" x2="68" y2="92" stroke="#94a3b8" stroke-width="2"/>
    <text x="46" y="108" class="small">양</text>
    <text x="68" y="375" text-anchor="middle" class="small">380</text>
    <text x="516" y="375" text-anchor="middle" class="small">780 nm</text>
    <text x="292" y="402" text-anchor="middle" class="small">파장 λ</text>

    <path d="M68 317C105 300 122 224 160 245C202 268 211 153 260 181C305 207 330 110 376 142C424 175 448 232 516 294L516 347L68 347Z" fill="url(#spectrum)" opacity=".28"/>
    <path d="M68 317C105 300 122 224 160 245C202 268 211 153 260 181C305 207 330 110 376 142C424 175 448 232 516 294" fill="none" stroke="url(#spectrum)" stroke-width="7"/>

    <g stroke="#f8fafc" stroke-width="2" stroke-dasharray="5 6" opacity=".78">
      <line x1="112" y1="326" x2="112" y2="279"/>
      <line x1="183" y1="347" x2="183" y2="230"/>
      <line x1="258" y1="347" x2="258" y2="180"/>
      <line x1="335" y1="347" x2="335" y2="143"/>
      <line x1="410" y1="347" x2="410" y2="160"/>
      <line x1="479" y1="347" x2="479" y2="258"/>
    </g>
    <g fill="#f8fafc">
      <circle cx="112" cy="279" r="6"/>
      <circle cx="183" cy="230" r="6"/>
      <circle cx="258" cy="180" r="6"/>
      <circle cx="335" cy="143" r="6"/>
      <circle cx="410" cy="160" r="6"/>
      <circle cx="479" cy="258" r="6"/>
    </g>
    <rect x="68" y="421" width="448" height="34" rx="17" fill="url(#spectrum)"/>
    <text x="292" y="484" text-anchor="middle" class="small">색 이름은 연속 변화에 붙인 이정표이고, 점은 계산에 선택한 Sample이다</text>
  </g>

  <g transform="translate(645 122)">
    <rect width="510" height="520" rx="22" class="panel"/>
    <text x="255" y="42" text-anchor="middle" class="label">스펙트럼 렌더링의 계산 흐름</text>

    <rect x="75" y="74" width="360" height="66" rx="16" class="box"/>
    <text x="255" y="102" text-anchor="middle" class="label">광원 E(λ)</text>
    <text x="255" y="126" text-anchor="middle" class="small">파장별로 얼마나 방출하는가</text>
    <line x1="255" y1="140" x2="255" y2="169" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="75" y="176" width="360" height="66" rx="16" class="box"/>
    <text x="255" y="204" text-anchor="middle" class="label">재질 R(λ)</text>
    <text x="255" y="228" text-anchor="middle" class="small">무엇을 반사·흡수하는가</text>
    <line x1="255" y1="242" x2="255" y2="271" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="75" y="278" width="360" height="66" rx="16" class="box"/>
    <text x="255" y="306" text-anchor="middle" class="label">경로 D(λ), 굴절률 n(λ)</text>
    <text x="255" y="330" text-anchor="middle" class="small">파장마다 어디로 이동하는가</text>
    <line x1="255" y1="344" x2="255" y2="373" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="75" y="380" width="360" height="66" rx="16" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <text x="255" y="408" text-anchor="middle" class="label">눈·센서 반응 → 화면 RGB</text>
    <text x="255" y="432" text-anchor="middle" class="small">계산한 스펙트럼을 표시할 색으로 변환</text>

    <text x="255" y="486" text-anchor="middle" class="small">물리 계산의 입력은 스펙트럼이고</text>
    <text x="255" y="510" text-anchor="middle" class="small">RGB 픽셀은 그 결과를 보여 주는 표현이다</text>
  </g>

  <rect x="330" y="672" width="540" height="44" rx="22" fill="#1e3a8a"/>
  <text x="600" y="700" text-anchor="middle" class="label">연속적인 현상 → 유한한 Sample → 화면의 세 채널</text>
</svg>
