<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1050" viewBox="0 0 640 1050" role="img" aria-labelledby="title desc">
  <title id="title">모바일용 둥근 빛의 예상과 길쭉한 프리즘 스펙트럼 비교</title>
  <desc id="desc">같은 굴절을 가정한 둥근 흰 상과 파장별 굴절로 길게 늘어난 실제 색 스펙트럼을 세로로 비교한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="spectrum" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#ef4444"/><stop offset=".18" stop-color="#f97316"/><stop offset=".35" stop-color="#facc15"/>
      <stop offset=".52" stop-color="#22c55e"/><stop offset=".68" stop-color="#06b6d4"/><stop offset=".84" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="whiteArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#f8fafc"/></marker>
    <style>
      .panel{fill:#fff;fill-opacity:.055;stroke:#94a3b8;stroke-width:2}
      .head{font:700 27px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .sub{font:500 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .label{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .small{font:500 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
    </style>
  </defs>

  <rect width="640" height="1050" rx="28" fill="url(#bg)"/>
  <text x="320" y="44" text-anchor="middle" class="head">둥근 상은 왜 길게 늘어났을까?</text>
  <text x="320" y="73" text-anchor="middle" class="sub">같은 굴절의 예상과 실제 관찰</text>

  <g transform="translate(35 100)">
    <rect class="panel" width="570" height="420" rx="20"/>
    <text x="285" y="39" text-anchor="middle" class="head">예상</text>
    <text x="285" y="66" text-anchor="middle" class="sub">모든 빛이 같은 정도로 굴절한다면</text>

    <circle cx="70" cy="205" r="28" fill="#020617" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="70" cy="205" r="10" fill="#f8fafc"/>
    <line x1="100" y1="205" x2="175" y2="205" stroke="#f8fafc" stroke-width="8"/>
    <polygon points="185,133 270,205 185,277" fill="#bfdbfe" fill-opacity=".22" stroke="#93c5fd" stroke-width="4"/>
    <line x1="235" y1="205" x2="430" y2="151" stroke="#f8fafc" stroke-width="8" marker-end="url(#whiteArrow)"/>
    <rect x="464" y="98" width="30" height="220" rx="7" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <circle cx="479" cy="138" r="25" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="479" y="346" text-anchor="middle" class="small">둥근 흰 상</text>
    <rect x="117" y="358" width="336" height="42" rx="21" fill="#1e3a8a"/>
    <text x="285" y="385" text-anchor="middle" class="label">모양 유지 · 위치만 이동</text>
  </g>

  <g transform="translate(35 545)">
    <rect class="panel" width="570" height="465" rx="20"/>
    <text x="285" y="39" text-anchor="middle" class="head">실제 관찰</text>
    <text x="285" y="66" text-anchor="middle" class="sub">성분마다 다른 굴절 방향으로 펼쳐졌다</text>

    <circle cx="70" cy="218" r="28" fill="#020617" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="70" cy="218" r="10" fill="#f8fafc"/>
    <line x1="100" y1="218" x2="175" y2="218" stroke="#f8fafc" stroke-width="8"/>
    <polygon points="185,146 270,218 185,290" fill="#bfdbfe" fill-opacity=".22" stroke="#93c5fd" stroke-width="4"/>
    <g fill="none" stroke-width="5">
      <path d="M235 218L431 279" stroke="#ef4444"/>
      <path d="M235 218L431 244" stroke="#f59e0b"/>
      <path d="M235 218L431 209" stroke="#22c55e"/>
      <path d="M235 218L431 174" stroke="#3b82f6"/>
      <path d="M235 218L431 139" stroke="#8b5cf6"/>
    </g>
    <rect x="464" y="98" width="30" height="270" rx="7" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <rect x="470" y="118" width="18" height="225" rx="9" fill="url(#spectrum)"/>
    <text x="479" y="397" text-anchor="middle" class="small">길쭉한 색 상</text>
    <rect x="109" y="403" width="352" height="42" rx="21" fill="#7c2d12"/>
    <text x="285" y="430" text-anchor="middle" class="label">성분마다 다른 위치에 도착</text>
  </g>
</svg>
