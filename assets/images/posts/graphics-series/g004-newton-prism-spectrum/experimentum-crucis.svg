<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Newton의 Experimentum Crucis 개념도</title>
  <desc id="desc">첫 프리즘에서 분리된 빨강과 보라 성분을 같은 구멍과 같은 두 번째 프리즘에 차례로 통과시키면 보라 성분이 빨강보다 더 크게 굴절된다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ef4444"/>
      <stop offset=".2" stop-color="#f97316"/>
      <stop offset=".38" stop-color="#facc15"/>
      <stop offset=".56" stop-color="#22c55e"/>
      <stop offset=".73" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <style>
      .head{font:700 30px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .sub{font:500 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .label{font:700 19px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .small{font:500 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .panel{fill:#fff;fill-opacity:.05;stroke:#64748b;stroke-width:2}
      .prism{fill:#bfdbfe;fill-opacity:.2;stroke:#93c5fd;stroke-width:4}
      .board{fill:#334155;stroke:#64748b;stroke-width:3}
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" class="head">결정적 실험: 입사 조건은 같고, 선택한 성분만 다르다</text>
  <text x="600" y="87" text-anchor="middle" class="sub">첫 프리즘을 돌려 같은 구멍으로 보낼 성분을 바꾼 뒤, 고정된 두 번째 프리즘의 결과를 비교한다</text>

  <g transform="translate(45 122)">
    <rect width="1110" height="248" rx="22" class="panel"/>
    <rect x="23" y="20" width="142" height="36" rx="18" fill="#7f1d1d"/>
    <text x="94" y="44" text-anchor="middle" class="label">실험 A · 빨강</text>

    <text x="95" y="112" text-anchor="middle" class="small">첫 프리즘</text>
    <polygon points="48,135 142,85 142,185" class="prism"/>
    <path d="M8 135H78" stroke="#f8fafc" stroke-width="8"/>
    <path d="M112 135L260 135" stroke="#ef4444" stroke-width="7"/>
    <path d="M112 135L245 104" stroke="url(#spectrum)" stroke-width="3" opacity=".5"/>
    <path d="M112 135L245 166" stroke="url(#spectrum)" stroke-width="3" opacity=".5"/>

    <rect x="265" y="70" width="28" height="130" rx="6" class="board"/>
    <circle cx="279" cy="135" r="8" fill="#020617" stroke="#e2e8f0" stroke-width="2"/>
    <text x="279" y="224" text-anchor="middle" class="small">고정 구멍</text>
    <path d="M293 135H532" stroke="#ef4444" stroke-width="7"/>
    <text x="412" y="118" text-anchor="middle" class="small">같은 입사 방향</text>

    <polygon points="548,69 662,135 548,201" class="prism"/>
    <text x="604" y="224" text-anchor="middle" class="small">고정된 두 번째 프리즘</text>
    <path d="M600 135L900 168" stroke="#ef4444" stroke-width="7"/>
    <rect x="914" y="55" width="28" height="150" rx="6" class="board"/>
    <circle cx="928" cy="168" r="15" fill="#ef4444"/>
    <text x="1005" y="151" class="label">덜 굴절</text>
    <text x="1005" y="177" class="small">빨강 유지</text>
  </g>

  <g transform="translate(45 398)">
    <rect width="1110" height="248" rx="22" class="panel"/>
    <rect x="23" y="20" width="142" height="36" rx="18" fill="#4c1d95"/>
    <text x="94" y="44" text-anchor="middle" class="label">실험 B · 보라</text>

    <text x="95" y="112" text-anchor="middle" class="small">첫 프리즘</text>
    <polygon points="48,135 142,85 142,185" class="prism"/>
    <path d="M8 135H78" stroke="#f8fafc" stroke-width="8"/>
    <path d="M112 135L260 135" stroke="#8b5cf6" stroke-width="7"/>
    <path d="M112 135L245 104" stroke="url(#spectrum)" stroke-width="3" opacity=".5"/>
    <path d="M112 135L245 166" stroke="url(#spectrum)" stroke-width="3" opacity=".5"/>

    <rect x="265" y="70" width="28" height="130" rx="6" class="board"/>
    <circle cx="279" cy="135" r="8" fill="#020617" stroke="#e2e8f0" stroke-width="2"/>
    <text x="279" y="224" text-anchor="middle" class="small">같은 고정 구멍</text>
    <path d="M293 135H532" stroke="#8b5cf6" stroke-width="7"/>
    <text x="412" y="118" text-anchor="middle" class="small">같은 입사 방향</text>

    <polygon points="548,69 662,135 548,201" class="prism"/>
    <text x="604" y="224" text-anchor="middle" class="small">같은 두 번째 프리즘</text>
    <path d="M600 135L900 98" stroke="#8b5cf6" stroke-width="7"/>
    <rect x="914" y="55" width="28" height="150" rx="6" class="board"/>
    <circle cx="928" cy="95" r="15" fill="#8b5cf6"/>
    <text x="1005" y="86" class="label">더 굴절</text>
    <text x="1005" y="112" class="small">보라 유지</text>
  </g>

  <rect x="295" y="681" width="610" height="50" rx="25" fill="#1e3a8a"/>
  <text x="600" y="713" text-anchor="middle" class="label">조건을 통제해도 성분마다 고유한 굴절 경향이 남는다</text>
</svg>
