<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
  <title id="title">Newton의 Experimentum Crucis 모바일 개념도</title>
  <desc id="desc">같은 구멍과 두 번째 프리즘에 빨강과 보라 성분을 차례로 보내면 보라 성분이 더 크게 굴절되는 것을 세로 화면에 나타낸다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <style>
      .head{font:700 27px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .sub{font:500 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .label{font:700 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .small{font:500 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .panel{fill:#fff;fill-opacity:.05;stroke:#64748b;stroke-width:2}
      .prism{fill:#bfdbfe;fill-opacity:.2;stroke:#93c5fd;stroke-width:4}
      .board{fill:#334155;stroke:#64748b;stroke-width:3}
    </style>
  </defs>
  <rect width="640" height="1120" rx="26" fill="url(#bg)"/>
  <text x="320" y="48" text-anchor="middle" class="head">결정적 실험</text>
  <text x="320" y="79" text-anchor="middle" class="sub">입사 조건은 같고 선택한 성분만 다르다</text>

  <g transform="translate(30 110)">
    <rect width="580" height="430" rx="22" class="panel"/>
    <rect x="22" y="20" width="142" height="38" rx="19" fill="#7f1d1d"/>
    <text x="93" y="45" text-anchor="middle" class="label">실험 A · 빨강</text>
    <path d="M25 125H95" stroke="#f8fafc" stroke-width="8"/>
    <polygon points="96,75 185,125 96,175" class="prism"/>
    <path d="M145 125H255" stroke="#ef4444" stroke-width="7"/>
    <text x="134" y="202" text-anchor="middle" class="small">첫 프리즘에서 선택</text>
    <rect x="260" y="68" width="28" height="114" rx="6" class="board"/>
    <circle cx="274" cy="125" r="8" fill="#020617" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M288 125H382" stroke="#ef4444" stroke-width="7"/>
    <polygon points="390,70 486,125 390,180" class="prism"/>
    <path d="M438 125L532 146" stroke="#ef4444" stroke-width="7"/>
    <circle cx="544" cy="149" r="14" fill="#ef4444"/>
    <text x="320" y="242" text-anchor="middle" class="small">고정 구멍 → 같은 입사 방향 → 고정 프리즘</text>
    <rect x="105" y="288" width="370" height="76" rx="18" fill="#450a0a"/>
    <text x="290" y="319" text-anchor="middle" class="label">빨강은 덜 꺾이고</text>
    <text x="290" y="348" text-anchor="middle" class="sub">다시 굴절해도 빨강을 유지</text>
  </g>

  <g transform="translate(30 568)">
    <rect width="580" height="430" rx="22" class="panel"/>
    <rect x="22" y="20" width="142" height="38" rx="19" fill="#4c1d95"/>
    <text x="93" y="45" text-anchor="middle" class="label">실험 B · 보라</text>
    <path d="M25 125H95" stroke="#f8fafc" stroke-width="8"/>
    <polygon points="96,75 185,125 96,175" class="prism"/>
    <path d="M145 125H255" stroke="#8b5cf6" stroke-width="7"/>
    <text x="134" y="202" text-anchor="middle" class="small">첫 프리즘에서 선택</text>
    <rect x="260" y="68" width="28" height="114" rx="6" class="board"/>
    <circle cx="274" cy="125" r="8" fill="#020617" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M288 125H382" stroke="#8b5cf6" stroke-width="7"/>
    <polygon points="390,70 486,125 390,180" class="prism"/>
    <path d="M438 125L532 86" stroke="#8b5cf6" stroke-width="7"/>
    <circle cx="544" cy="81" r="14" fill="#8b5cf6"/>
    <text x="320" y="242" text-anchor="middle" class="small">같은 구멍 → 같은 입사 방향 → 같은 프리즘</text>
    <rect x="105" y="288" width="370" height="76" rx="18" fill="#2e1065"/>
    <text x="290" y="319" text-anchor="middle" class="label">보라는 더 크게 꺾이고</text>
    <text x="290" y="348" text-anchor="middle" class="sub">다시 굴절해도 보라를 유지</text>
  </g>

  <rect x="58" y="1030" width="524" height="58" rx="29" fill="#1e3a8a"/>
  <text x="320" y="1066" text-anchor="middle" class="label">차이는 프리즘 위치가 아니라 빛 성분에 남았다</text>
</svg>
