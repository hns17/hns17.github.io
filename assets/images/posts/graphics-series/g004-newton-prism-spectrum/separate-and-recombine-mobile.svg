<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" role="img" aria-labelledby="title desc">
  <title id="title">프리즘 분리와 렌즈 재결합 모바일 개념도</title>
  <desc id="desc">모든 색 성분을 렌즈로 모을 때와 일부를 차단할 때의 결과를 세로 화면에서 비교한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <style>
      .head{font:700 27px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .sub{font:500 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .label{font:700 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .small{font:500 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .panel{fill:#fff;fill-opacity:.05;stroke:#64748b;stroke-width:2}
      .prism{fill:#bfdbfe;fill-opacity:.2;stroke:#93c5fd;stroke-width:4}
    </style>
  </defs>
  <rect width="640" height="1080" rx="26" fill="url(#bg)"/>
  <text x="320" y="48" text-anchor="middle" class="head">분리한 빛을 다시 모으면?</text>
  <text x="320" y="79" text-anchor="middle" class="sub">재결합으로 흰빛의 구성을 시험한다</text>

  <g transform="translate(30 108)">
    <rect width="580" height="405" rx="22" class="panel"/>
    <rect x="22" y="20" width="205" height="38" rx="19" fill="#166534"/>
    <text x="124" y="45" text-anchor="middle" class="label">모든 성분을 모은다</text>
    <path d="M24 140H92" stroke="#f8fafc" stroke-width="9"/>
    <polygon points="95,88 184,140 95,192" class="prism"/>
    <g fill="none" stroke-width="5">
      <path d="M143 140L292 88L445 140" stroke="#8b5cf6"/>
      <path d="M143 140L292 107L445 140" stroke="#3b82f6"/>
      <path d="M143 140L292 124L445 140" stroke="#22c55e"/>
      <path d="M143 140L292 143L445 140" stroke="#facc15"/>
      <path d="M143 140L292 161L445 140" stroke="#f97316"/>
      <path d="M143 140L292 181L445 140" stroke="#ef4444"/>
    </g>
    <path d="M278 76Q314 140 278 204Q310 192 330 140Q310 88 278 76Z" fill="#dbeafe" fill-opacity=".3" stroke="#93c5fd" stroke-width="4"/>
    <path d="M445 140H518" stroke="#f8fafc" stroke-width="9"/>
    <circle cx="530" cy="140" r="17" fill="#f8fafc"/>
    <text x="320" y="245" text-anchor="middle" class="small">프리즘으로 분리 → 렌즈로 모두 재결합</text>
    <rect x="118" y="283" width="344" height="72" rx="18" fill="#14532d"/>
    <text x="290" y="314" text-anchor="middle" class="label">결과: 흰빛</text>
    <text x="290" y="340" text-anchor="middle" class="sub">모든 성분이 한곳에 겹친다</text>
  </g>

  <g transform="translate(30 541)">
    <rect width="580" height="405" rx="22" class="panel"/>
    <rect x="22" y="20" width="205" height="38" rx="19" fill="#9a3412"/>
    <text x="124" y="45" text-anchor="middle" class="label">일부 성분을 가린다</text>
    <path d="M24 140H92" stroke="#f8fafc" stroke-width="9"/>
    <polygon points="95,88 184,140 95,192" class="prism"/>
    <g fill="none" stroke-width="5">
      <path d="M143 140L292 88L445 140" stroke="#8b5cf6"/>
      <path d="M143 140L292 107L445 140" stroke="#3b82f6"/>
      <path d="M143 140L292 124L445 140" stroke="#22c55e"/>
      <path d="M143 140L292 143L445 140" stroke="#facc15"/>
      <path d="M143 140L292 161L445 140" stroke="#f97316"/>
      <path d="M143 140L292 181L445 140" stroke="#ef4444" stroke-dasharray="9 8" opacity=".24"/>
    </g>
    <rect x="188" y="169" width="70" height="30" rx="7" fill="#020617" stroke="#94a3b8" stroke-width="3"/>
    <text x="223" y="190" text-anchor="middle" class="small">차단</text>
    <path d="M278 76Q314 140 278 204Q310 192 330 140Q310 88 278 76Z" fill="#dbeafe" fill-opacity=".3" stroke="#93c5fd" stroke-width="4"/>
    <path d="M445 140H518" stroke="#c4b5fd" stroke-width="9"/>
    <circle cx="530" cy="140" r="17" fill="#c4b5fd"/>
    <text x="320" y="245" text-anchor="middle" class="small">한 성분을 빼면 같은 흰빛으로 돌아가지 않는다</text>
    <rect x="118" y="283" width="344" height="72" rx="18" fill="#581c87"/>
    <text x="290" y="314" text-anchor="middle" class="label">결과: 다른 혼합색</text>
    <text x="290" y="340" text-anchor="middle" class="sub">성분의 조합이 달라졌다</text>
  </g>

  <rect x="74" y="981" width="492" height="68" rx="24" fill="#1e3a8a"/>
  <text x="320" y="1009" text-anchor="middle" class="label">흰빛은 하나의 흰 파장이 아니라</text>
  <text x="320" y="1035" text-anchor="middle" class="label">여러 성분의 조합이다</text>
</svg>
