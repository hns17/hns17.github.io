<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">직접광을 구성하는 Lighting, Shading과 Shadow 항</title>
  <desc id="desc">들어오는 빛 Li, 표면 반사와 방향 관계, 가시성 V가 곱해져 카메라로 나가는 빛 Lo에 기여한다.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr2" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0 0 L0 8 L11 4 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .head2{font:700 30px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .sub2{font:500 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .term{font:800 32px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#0f172a}
      .name{font:700 23px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#f8fafc}
      .body{font:500 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#cbd5e1}
      .symbol{font:800 42px "Noto Sans",sans-serif;fill:#f8fafc}
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg2)"/>
  <text x="600" y="60" text-anchor="middle" class="head2">한 표면 지점의 직접광은 세 질문의 답을 함께 사용한다</text>
  <text x="600" y="94" text-anchor="middle" class="sub2">단순화한 관계: Lₒ = Lₑ + V × Lᵢ × fᵣ × max(0, N · L)</text>

  <g transform="translate(60 150)">
    <rect width="270" height="310" rx="24" fill="#1d4ed8" fill-opacity=".28" stroke="#60a5fa" stroke-width="3"/>
    <circle cx="52" cy="52" r="30" fill="#93c5fd"/>
    <text x="52" y="63" text-anchor="middle" class="term">Lᵢ</text>
    <text x="95" y="60" class="name">Lighting</text>
    <text x="135" y="120" text-anchor="middle" class="body">광원에서 표면으로</text>
    <text x="135" y="148" text-anchor="middle" class="body">들어오는 빛</text>
    <line x1="70" y1="208" x2="200" y2="208" stroke="#fde68a" stroke-width="7"/>
    <path d="M200 208 L178 194 L178 222 Z" fill="#fde68a"/>
    <circle cx="65" cy="208" r="18" fill="#fef3c7"/>
    <text x="135" y="270" text-anchor="middle" class="body">방향 · 세기 · 색 · 거리</text>
  </g>

  <text x="365" y="320" class="symbol">×</text>

  <g transform="translate(410 150)">
    <rect width="310" height="310" rx="24" fill="#15803d" fill-opacity=".24" stroke="#4ade80" stroke-width="3"/>
    <circle cx="52" cy="52" r="30" fill="#86efac"/>
    <text x="52" y="62" text-anchor="middle" class="term">fᵣ</text>
    <text x="95" y="60" class="name">Shading</text>
    <text x="155" y="120" text-anchor="middle" class="body">재질의 반사 × 방향 관계</text>
    <circle cx="155" cy="205" r="62" fill="#475569"/>
    <line x1="155" y1="205" x2="155" y2="132" stroke="#86efac" stroke-width="5"/>
    <path d="M155 132 L144 151 L166 151 Z" fill="#86efac"/>
    <line x1="155" y1="205" x2="99" y2="160" stroke="#fde68a" stroke-width="5"/>
    <path d="M99 160 L121 164 L108 180 Z" fill="#fde68a"/>
    <text x="155" y="284" text-anchor="middle" class="body">fᵣ × max(0, N · L)</text>
  </g>

  <text x="755" y="320" class="symbol">×</text>

  <g transform="translate(800 150)">
    <rect width="270" height="310" rx="24" fill="#b91c1c" fill-opacity=".24" stroke="#f87171" stroke-width="3"/>
    <circle cx="52" cy="52" r="30" fill="#fca5a5"/>
    <text x="52" y="63" text-anchor="middle" class="term">V</text>
    <text x="95" y="60" class="name">Shadow</text>
    <text x="135" y="120" text-anchor="middle" class="body">광원까지의 가시성</text>
    <circle cx="65" cy="190" r="17" fill="#fef3c7"/>
    <line x1="85" y1="190" x2="210" y2="240" stroke="#fde68a" stroke-width="4" stroke-dasharray="9 7"/>
    <rect x="130" y="168" width="45" height="90" rx="7" fill="#ef4444"/>
    <circle cx="210" cy="240" r="9" fill="#f8fafc"/>
    <text x="135" y="284" text-anchor="middle" class="body">보이면 1 · 가리면 0</text>
  </g>

  <path d="M1075 305 L1140 305" stroke="#94a3b8" stroke-width="5" marker-end="url(#arr2)"/>
  <circle cx="1152" cy="305" r="28" fill="#f8fafc"/>
  <text x="1152" y="313" text-anchor="middle" class="term">Lₒ</text>

  <rect x="255" y="510" width="690" height="66" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#64748b"/>
  <text x="600" y="540" text-anchor="middle" class="body">어두운 결과 하나에도 원인은 다르다</text>
  <text x="600" y="565" text-anchor="middle" class="sub2">빛이 약함 · 표면이 등짐 · 재질이 흡수함 · 다른 물체가 가림</text>
</svg>
