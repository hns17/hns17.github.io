<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Lighting, Shading과 Shadow의 단계별 비교</title>
  <desc id="desc">같은 구와 바닥을 사용해 Lighting 정보만 있는 경우, Shading을 적용한 경우, Shadow까지 계산한 경우를 비교한다.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="litSphere" cx="31%" cy="25%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".32" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="lamp3">
      <stop offset="0" stop-color="#fff7cc"/>
      <stop offset=".55" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="blur3" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <style>
      .head3{font:800 31px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#0f172a}
      .sub3{font:500 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#475569}
      .panel3{fill:#ffffff;stroke:#94a3b8;stroke-width:2}
      .label3{font:700 22px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#0f172a}
      .body3{font:500 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#475569}
      .tag3{font:700 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#ffffff}
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg3)"/>
  <text x="600" y="54" text-anchor="middle" class="head3">같은 장면에서 하나씩 계산을 더해 보기</text>
  <text x="600" y="86" text-anchor="middle" class="sub3">구, 바닥, 카메라와 광원은 그대로 두고 표면 반응과 가시성만 바꾼다</text>

  <g transform="translate(45 125)">
    <rect class="panel3" width="350" height="485" rx="22"/>
    <rect x="22" y="20" width="112" height="30" rx="15" fill="#2563eb"/>
    <text x="78" y="41" text-anchor="middle" class="tag3">Lighting 정보</text>
    <circle cx="72" cy="105" r="25" fill="url(#lamp3)"/>
    <g stroke="#f59e0b" stroke-width="3">
      <line x1="72" y1="68" x2="72" y2="56"/><line x1="37" y1="105" x2="25" y2="105"/>
      <line x1="46" y1="79" x2="37" y2="70"/><line x1="98" y1="79" x2="107" y2="70"/>
    </g>
    <polygon points="25,365 325,365 300,430 50,430" fill="#cbd5e1"/>
    <circle cx="185" cy="290" r="83" fill="#6b8fc9" stroke="#475569" stroke-width="3"/>
    <text x="175" y="438" text-anchor="middle" class="label3">빛의 위치만 안다</text>
    <text x="175" y="468" text-anchor="middle" class="body3">표면은 아직 한 색으로 보인다</text>
  </g>

  <g transform="translate(425 125)">
    <rect class="panel3" width="350" height="485" rx="22"/>
    <rect x="22" y="20" width="138" height="30" rx="15" fill="#15803d"/>
    <text x="91" y="41" text-anchor="middle" class="tag3">+ Shading</text>
    <circle cx="72" cy="105" r="25" fill="url(#lamp3)"/>
    <g stroke="#f59e0b" stroke-width="3">
      <line x1="72" y1="68" x2="72" y2="56"/><line x1="37" y1="105" x2="25" y2="105"/>
      <line x1="46" y1="79" x2="37" y2="70"/><line x1="98" y1="79" x2="107" y2="70"/>
    </g>
    <polygon points="25,365 325,365 300,430 50,430" fill="#dbeafe"/>
    <circle cx="185" cy="290" r="83" fill="url(#litSphere)" stroke="#1e3a8a" stroke-width="3"/>
    <text x="175" y="438" text-anchor="middle" class="label3">구의 형태가 보인다</text>
    <text x="175" y="468" text-anchor="middle" class="body3">하지만 바닥은 빛의 가림을 모른다</text>
  </g>

  <g transform="translate(805 125)">
    <rect class="panel3" width="350" height="485" rx="22"/>
    <rect x="22" y="20" width="154" height="30" rx="15" fill="#b91c1c"/>
    <text x="99" y="41" text-anchor="middle" class="tag3">+ Shadow</text>
    <circle cx="72" cy="105" r="25" fill="url(#lamp3)"/>
    <g stroke="#f59e0b" stroke-width="3">
      <line x1="72" y1="68" x2="72" y2="56"/><line x1="37" y1="105" x2="25" y2="105"/>
      <line x1="46" y1="79" x2="37" y2="70"/><line x1="98" y1="79" x2="107" y2="70"/>
    </g>
    <polygon points="25,365 325,365 300,430 50,430" fill="#dbeafe"/>
    <ellipse cx="235" cy="380" rx="88" ry="24" fill="#334155" fill-opacity=".55" filter="url(#blur3)"/>
    <ellipse cx="235" cy="380" rx="72" ry="17" fill="#334155" fill-opacity=".58"/>
    <circle cx="185" cy="290" r="83" fill="url(#litSphere)" stroke="#1e3a8a" stroke-width="3"/>
    <text x="175" y="438" text-anchor="middle" class="label3">공간 관계가 보인다</text>
    <text x="175" y="468" text-anchor="middle" class="body3">구가 막은 직접광이 바닥에서 사라진다</text>
  </g>

  <text x="600" y="650" text-anchor="middle" class="sub3">Lighting은 입력을 정하고, Shading은 형태를 드러내며, Shadow는 빛의 가림을 공간에 연결한다</text>
</svg>
